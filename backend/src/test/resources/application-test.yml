app:
  saas:
    payment:
      provider: mock
  integration:
    edocument:
      provider: mock
  files:
    root: ./target/test-files
  finance:
    tcmb:
      enabled: false
  reporting:
    dashboard-cache-ttl: 0s
  tenancy:
    base-domain: blackrose.test
  security:
    jwt-secret: test-only-jwt-secret-with-at-least-32-bytes
    totp-key: test-only-totp-key-with-at-least-32-bytes
    metrics-token: test-only-metrics-token-with-at-least-32-bytes
    bootstrap-admin-email: saas@blackrose.test
    bootstrap-admin-password: Test-Admin-12345
    saas-two-factor-required: false
    rate-limit:
      login-per-minute: 100000
      password-reset-per-minute: 100000
      refresh-per-minute: 100000
      tracking-per-minute: 100000
