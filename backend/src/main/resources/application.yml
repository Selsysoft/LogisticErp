spring:
  application:
    name: blackrose
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blackrose}
    username: ${DB_USERNAME:blackrose}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/admin
    schemas: admin
    default-schema: admin
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    web:
      pageable:
        max-page-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      console: logstash

app:
  files:
    root: ${FILES_ROOT:./data/files}
  finance:
    tcmb:
      enabled: ${TCMB_ENABLED:true}
      url: ${TCMB_URL:https://www.tcmb.gov.tr/kurlar/today.xml}
  tenancy:
    base-domain: ${TENANCY_BASE_DOMAIN:blackrose.local}
  security:
    jwt-secret: ${JWT_SECRET:}
    totp-key: ${TOTP_ENCRYPTION_KEY:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    saas-token-ttl: 1h
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:noreply@blackrose.local}
    bootstrap-admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
