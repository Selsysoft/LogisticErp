spring:
  application:
    name: blackrose
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blackrose}
    username: ${DB_USERNAME:blackrose}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/admin
    schemas: admin
    default-schema: admin
  data:
    web:
      pageable:
        max-page-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      console: logstash

app:
  tenancy:
    base-domain: ${TENANCY_BASE_DOMAIN:blackrose.local}
    admin-api-key: ${ADMIN_API_KEY:}
