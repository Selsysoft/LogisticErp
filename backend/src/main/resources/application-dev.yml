spring:
  datasource:
    password: ${DB_PASSWORD:blackrose}

# Bu değerler yalnız yerel geliştirme içindir.
app:
  saas:
    payment:
      provider: mock
  integration:
    edocument:
      provider: mock
  tenancy:
    base-domain: ${TENANCY_BASE_DOMAIN:localhost}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production}
    totp-key: ${TOTP_ENCRYPTION_KEY:dev-only-totp-key-do-not-use-in-production}
    bootstrap-admin-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@blackrose.local}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:Dev-Admin-12345}
    saas-two-factor-required: ${SAAS_2FA_REQUIRED:false}
