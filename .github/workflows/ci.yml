name: CI

on:
  push:
    branches: [main]
  pull_request:

# İş akışı depoya yazmaz; token yalnız okuyabilir.
permissions:
  contents: read

# Eylemler değiştirilebilir etiket yerine commit SHA'sına sabitlidir (tedarik zinciri koruması);
# güncellemeleri Dependabot (.github/dependabot.yml) önerir.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # coverage profili: kapsam ölçülen alt sınırın altına düşerse CI durur (backend/pom.xml).
      - name: Derleme, migration ve testler
        run: mvn -B -f backend/pom.xml verify -Pcoverage
      - name: Kapsam özeti
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: python3 .github/scripts/coverage-summary.py backend/target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Kapsam raporu
        if: always() && hashFiles('backend/target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 14
      - name: Container imajı
        run: docker build --pull -t blackrose-backend backend
      # İmajdaki bütün JAR'lar ve işletim sistemi paketleri; düzeltmesi olan yüksek/kritik açıkta CI durur.
      - name: Bağımlılık taraması (Trivy)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.trivyignore:/work/.trivyignore:ro"
          aquasec/trivy:0.67.2 image
          --ignorefile /work/.trivyignore
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          blackrose-backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tarayıcıya giden paketlerde yüksek/kritik açıkta CI durur.
      - name: Bağımlılık denetimi
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Web sunucusu imajı
        run: docker build --pull -t blackrose-web .
      - name: Bağımlılık taraması (Trivy)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.trivyignore:/work/.trivyignore:ro"
          aquasec/trivy:0.67.2 image
          --ignorefile /work/.trivyignore
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          blackrose-web
      # nginx yapılandırması imajın içinde sözdizimi açısından denetlenir.
      - name: nginx yapılandırma denetimi
        run: docker run --rm -e BACKEND_URL=http://127.0.0.1:8080 blackrose-web sh -c "/docker-entrypoint.sh nginx -t"

  # Tam yığın (nginx imajı, backend, PostgreSQL, Mailpit) üzerinde tarayıcı testleri.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test yığını
        run: docker compose -f docker-compose.e2e.yml up -d --build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Backend hazır
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8090/api/v1/ping && exit 0
            sleep 3
          done
          docker compose -f docker-compose.e2e.yml logs backend
          exit 1
      - name: Uçtan uca testler
        run: npm run e2e
        working-directory: frontend
      - name: Hata raporu
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Backend günlüğü
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs backend | tail -200
