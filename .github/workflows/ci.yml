name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Derleme, migration ve testler
        run: mvn -B -f backend/pom.xml verify
      - name: Container imajı
        run: docker build --pull -t blackrose-backend backend
      # İmajdaki bütün JAR'lar ve işletim sistemi paketleri; düzeltmesi olan yüksek/kritik açıkta CI durur.
      - name: Bağımlılık taraması (Trivy)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.trivyignore:/work/.trivyignore:ro"
          aquasec/trivy:0.67.2 image
          --ignorefile /work/.trivyignore
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          blackrose-backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tarayıcıya giden paketlerde yüksek/kritik açıkta CI durur.
      - name: Bağımlılık denetimi
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
