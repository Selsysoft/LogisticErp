# Her location'a ayrıca eklenir: nginx, kendi add_header'ı olan location'a üst düzeydekileri aktarmaz.
#
# style-src 'unsafe-inline': MUI/Emotion stilleri çalışma anında <style> etiketiyle ekler.
# Betikler yalnız kendi alan adından yüklenir; satır içi betik ve eval engellidir.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Tarayıcı yalnız HTTPS ile açılan sayfada dikkate alır; TLS bu vekilin önünde sonlansa da geçerlidir.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Şifre sıfırlama ve davet bağlantılarındaki token başka siteye adres olarak gitmez.
add_header Referrer-Policy "same-origin" always;
# Sürücü ekranı konum ve kamera kullanır; diğerleri kapalı.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
